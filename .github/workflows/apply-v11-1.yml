name: Apply v11.1 guided sets
on:
  push:
    paths:
      - '.github/workflows/apply-v11-1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/index.html")
          s=p.read_text()
          s=s.replace("v11.0","v11.1")
          sup='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>'
          if 'curated-sets.js' not in s:
              s=s.replace(sup,sup+'\n<script src="./resources/curated-sets.js"></script>')
          old='const CURATED_SETS=[\n // Kuratierte Inhalte werden ab v11.1 gemeinsam ergänzt.\n];'
          s=s.replace(old,'const CURATED_SETS=window.KOTODAMA_CURATED_SETS||[];')
          a=s.index("function renderSetLibrary(){")
          b=s.index("function ensureCardV5(c){",a)
          block=r'''function curatedIntroducedIds(set){return new Set(db.cards.filter(c=>c.curatedSetId===set.id&&c.sourceTemplateId).map(c=>c.sourceTemplateId))}
          function lessonState(set,lesson){const ids=curatedIntroducedIds(set),done=lesson.cards.filter(x=>ids.has(x.id)).length;return {done,total:lesson.cards.length,complete:done===lesson.cards.length}}
          function nextGuidedLesson(set){return set.lessons.find(l=>!lessonState(set,l).complete)||null}
          function introduceGuidedLesson(setId,lessonId){
           const set=CURATED_SETS.find(s=>s.id===setId),lesson=set?.lessons.find(l=>l.id===lessonId);if(!set||!lesson)return;
           const known=curatedIntroducedIds(set),fresh=lesson.cards.filter(t=>!known.has(t.id));if(!fresh.length)return;
           if(!confirm('Lerneinheit „'+lesson.title+'“ mit '+fresh.length+' neuer/n Karte(n) beginnen?'))return;
           const t=now();
           for(const x of fresh)db.cards.push({id:uid(),front:x.front,reading:x.reading||'',back:x.back,example:x.example||'',createdAt:t,updatedAt:t,due:t,reps:0,intervalDays:0,ease:2.5,lapses:0,lastReview:null,state:'new',learningStep:0,stability:0.3,difficulty:5,history:[],source:'curated',setIds:[set.id],curatedSetId:set.id,sourceTemplateId:x.id,lessonId:lesson.id,cardType:x.type||'word',contrastGroup:x.contrast||null,register:x.register||null});
           db.meta.sets[set.id]={...(db.meta.sets[set.id]||{}),lastIntroducedLesson:lesson.id};save();
          }
          function renderSetLibrary(){
           const box=$('setLibrary');if(!box)return;
           box.innerHTML=setDefinitions().map(s=>{
            const active=cardsForSet(s.id),total=s.kind==='curated'?(s.cards?.length||0):active.length,introduced=s.kind==='curated'?active.filter(c=>c.curatedSetId===s.id).length:active.length,pct=total?Math.round(introduced/total*100):0,safety=setSafetyScore(active);
            let guided='';
            if(s.kind==='curated'&&s.mode==='guided'){const next=nextGuidedLesson(s);guided=next?(()=>{const st=lessonState(s,next),fresh=st.total-st.done;return '<div style="margin-top:12px;padding:12px;background:rgba(255,255,255,.05);border-radius:6px"><div class="note">ALS NÄCHSTES EMPFOHLEN</div><div style="font-weight:800;margin:4px 0">'+safe(next.title)+'</div><div class="note">'+safe(next.summary||'')+' · '+fresh+' neue Karte'+(fresh===1?'':'n')+'</div><button class="btn primary small guided-start" data-set="'+s.id+'" data-lesson="'+next.id+'" style="margin-top:9px">Lerneinheit beginnen</button></div>'})():'<div class="note" style="margin-top:10px">✓ Alle Lerneinheiten dieses Sets wurden eingeführt.</div>'}
            return '<div class="panel set-card"><div class="set-card-head"><div><div class="section-title">'+safe(s.name)+'</div><div class="note">'+safe(s.description||'')+'</div></div><span class="set-chip">'+(s.kind==='user'?'USER-SET':'GEFÜHRT')+'</span></div><div class="set-progress"><div style="width:'+pct+'%"></div></div><div class="note">'+(s.kind==='user'?active.length+' Karten · Sicherheit Ø '+safety+'%':introduced+' / '+total+' eingeführt · Sicherheit Ø '+safety+'%')+'</div>'+guided+'</div>';
           }).join('');
           box.querySelectorAll('.guided-start').forEach(b=>b.onclick=()=>introduceGuidedLesson(b.dataset.set,b.dataset.lesson));
          }
          '''
          s=s[:a]+block+s[b:]
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          s=open("docs/index.html").read()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          open("/tmp/app.js","w").write("\n".join(js))
          PY
          node --check /tmp/app.js
          node --check docs/resources/curated-sets.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Deploy v11.1 guided Nuancen set"
          git push

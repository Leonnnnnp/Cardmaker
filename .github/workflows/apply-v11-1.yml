name: Apply v11.2 review set tiles 
on:
  push:
    paths: ['.github/workflows/apply-v11-1.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/index.html"); s=p.read_text().replace("v11.1","v11.2")
          css='.review-set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0}.review-set-tile{aspect-ratio:1/1;min-height:145px;padding:12px;background:#241c39;border:2px solid #51456b;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 0 var(--frame)}.review-set-tile.selected{border-color:var(--amber)}.review-set-tile h3{margin:0;font-size:1rem}.review-set-tile .tile-count{font-size:1.65rem;font-weight:900;color:var(--amber)}.review-set-actions{display:flex;gap:5px;flex-wrap:wrap}.review-set-actions .btn{padding:6px 8px;font-size:11px}@media(max-width:420px){.review-set-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.review-set-tile{min-height:138px;padding:10px}}'
          if '.review-set-grid{' not in s:s=s.replace('.main-menu{display:grid;',css+'\n.main-menu{display:grid;')
          s=s.replace('<div class="row" style="margin:8px 0"><span class="note">Set:</span><select id="reviewSetFilter" class="set-select"></select></div>','<div class="note">Wähle ein Set. Die Kachel zeigt dir direkt, was fällig ist und wie weit du bist.</div><div id="reviewSetTiles" class="review-set-grid"></div><select id="reviewSetFilter" class="hidden"></select>')
          s=s.replace('<div class="panel">\n     <div class="section-title">Review-Optionen</div>\n     <div class="note">Die Set-Auswahl kommt mit dem nächsten Ausbau der Wortlisten. Deine aktuelle SRS-Logik bleibt unverändert.</div>\n   </div>','<div class="panel"><div class="section-title">Abfragerichtung</div><div class="note">Gemischte Reviews gewichten aktiven Abruf stärker: Deutsch → Japanisch erscheint häufiger als Japanisch → Deutsch.</div></div>')
          anchor='function curatedIntroducedIds(set){'
          tilefun=r'''function renderReviewSetTiles(){
           const box=$('reviewSetTiles'),select=$('reviewSetFilter');if(!box||!select)return;
           const chosen=select.value||'all',due=dueCards();
           box.innerHTML=setDefinitions().map(set=>{
             const cards=cardsForSet(set.id),setDue=cardsForSet(set.id,due),safety=setSafetyScore(cards);
             const total=set.kind==='curated'?(set.cards?.length||0):cards.length,introduced=set.kind==='curated'?cards.filter(c=>c.curatedSetId===set.id).length:cards.length;
             const progress=total?Math.round(introduced/total*100):0,next=set.kind==='curated'&&set.mode==='guided'?nextGuidedLesson(set):null;
             return '<div class="review-set-tile '+(chosen===set.id?'selected':'')+'" data-review-set="'+set.id+'"><div><h3>'+safe(set.name)+'</h3><div class="tile-count">'+setDue.length+'</div><div class="note">jetzt fällig</div></div><div><div class="set-progress"><div style="width:'+progress+'%"></div></div><div class="note">'+(set.kind==='curated'?introduced+' / '+total+' eingeführt':'Sicherheit Ø '+safety+'%')+'</div><div class="review-set-actions"><button class="btn small '+(setDue.length?'primary':'ghost')+'" data-review-now="'+set.id+'" '+(setDue.length?'':'disabled')+'>Fällige lernen</button>'+(next?'<button class="btn small ghost" data-review-new="'+set.id+'" data-lesson="'+next.id+'">+ Neue</button>':'')+'</div></div></div>';
           }).join('');
           box.querySelectorAll('[data-review-set]').forEach(t=>t.onclick=e=>{if(e.target.closest('button'))return;select.value=t.dataset.reviewSet;refreshReviewExpedition(cardsForSet(select.value,dueCards()));renderReviewSetTiles()});
           box.querySelectorAll('[data-review-now]').forEach(b=>b.onclick=e=>{e.stopPropagation();select.value=b.dataset.reviewNow;startReview()});
           box.querySelectorAll('[data-review-new]').forEach(b=>b.onclick=e=>{e.stopPropagation();introduceGuidedLesson(b.dataset.reviewNew,b.dataset.lesson)});
          }
          '''
          if 'function renderReviewSetTiles(){' not in s:s=s.replace(anchor,tilefun+anchor)
          s=s.replace("renderSetSelectors();\n refreshReviewExpedition","renderSetSelectors();\n renderReviewSetTiles();\n refreshReviewExpedition")
          old=""" const state=cardStatus(card);
 const jpProbability=state==='new'?0.70:state==='mature'?0.45:0.55;
 return Math.random()<jpProbability?'jp-de':'de-jp';"""
          new=""" // Aktiver Abruf (Deutsch → Japanisch) wird bewusst stärker gewichtet.
 const jpProbability=0.35;
 return Math.random()<jpProbability?'jp-de':'de-jp';"""
          if old not in s: raise SystemExit("direction block not found")
          s=s.replace(old,new); p.write_text(s)
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import re
          s=open("docs/index.html").read()
          open("/tmp/app.js","w").write("\n".join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          assert 'function renderReviewSetTiles()' in s
          assert "const jpProbability=0.35" in s
          assert "cardsForSet($('reviewSetFilter')?.value||'all',dueCards())" in s
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Add v11.2 review set tiles and active recall weighting"
          git push

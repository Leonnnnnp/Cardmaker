name: Review checks
on:
  push:
    paths: ['docs/index.html', 'docs/resources/curated-sets.js', 'tests/review.test.cjs', '.github/workflows/review-checks.yml']
  pull_request:
    paths: ['docs/index.html', 'docs/resources/curated-sets.js', 'tests/review.test.cjs', '.github/workflows/review-checks.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/review.test.cjs
